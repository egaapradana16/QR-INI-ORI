    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --background: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
    }

    @layer base {
        body {
            @apply bg-[var(--background)] text-[var(--text-main)] font-sans selection:bg-blue-100;
        }
    }

    @layer components {
        .btn-primary {
            @apply px-6 py-2.5 bg-[var(--primary)] text-white rounded-lg font-semibold hover:bg-[var(--primary-dark)] transition-all duration-200 flex items-center justify-center gap-2 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed;
        }
        .btn-outline {
            @apply px-6 py-2.5 border-2 border-[var(--primary)] text-[var(--primary)] rounded-lg font-semibold hover:bg-blue-50 transition-all duration-200 flex items-center justify-center gap-2;
        }
        .input-field {
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-gray-400;
        }
        .card-container {
            @apply bg-[var(--card)] rounded-xl shadow-xl border border-gray-100 overflow-hidden;
        }
        .section-title {
            @apply text-xl font-bold flex items-center gap-2 mb-4;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .tab-btn {
            @apply px-4 py-2 text-sm font-medium border-b-2 transition-all duration-200;
        }
        .tab-btn-active {
            @apply border-blue-600 text-blue-600;
        }
        .tab-btn-inactive {
            @apply border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="utils/qrUtils.js"></script>
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/QRForm.js"></script>
    <script type="text/babel" src="components/QRPreview.js"></script>
    <script type="text/babel" src="components/Footer.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
